<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SperoCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+Thambi+2:wght@600;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --root:20px; --bw:1.5px;
  --bg:#F7F6F0; --surface:#FFFFFF; --surface2:#E7EFE6; --ink:#1B2421; --ink2:#45524C; --line:#C9D2C8;
  --accent:#1B6B52; --accent-ink:#FFFFFF; --good:#1B7F4B; --good-ink:#FFFFFF; --bad:#C62828; --bad-ink:#FFFFFF;
  --c1:#1B6B52; --c2:#D98E04; --c3:#3B7DD8; --focus:#0B57D0;
  color-scheme:light;
}
html{height:100%;font-size:var(--root);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1rem;line-height:1.5;transition:background .25s,color .25s}
html[lang=ta] body{font-family:'Noto Sans Tamil','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.65}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,.disp{font-family:'Baloo Thambi 2','Noto Sans Tamil','Atkinson Hyperlegible',sans-serif;font-weight:800;line-height:1.2;margin:0}
h1{font-size:clamp(1.7rem,6vw,2.3rem)}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:.4rem 0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.sm{color:var(--ink2);font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(100% - 1.5rem,60rem);margin-inline:auto}
main{padding:1rem 0 8rem;outline:none}
.sec{margin:1.7rem 0 .6rem}

/* header + nav (fixed px so text-size setting scales content, not chrome) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.top .in{display:flex;align-items:center;gap:.45rem;padding:.4rem 0;flex-wrap:wrap}
.brand{margin-right:auto;background:none;border:0;padding:.2rem .1rem;color:var(--ink);font:800 26px/1 'Baloo Thambi 2','Noto Sans Tamil',sans-serif;letter-spacing:-.01em}
.hb{min-height:44px;min-width:44px;padding:0 .75rem;border-radius:12px;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font:700 16px/1 'Atkinson Hyperlegible','Noto Sans Tamil',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.hb svg{width:20px;height:20px}
.hb.help{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.hb .aa{font-weight:800;font-size:18px}.hb .aa small{font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;width:min(100%,42rem);margin-inline:auto}
.nb{flex:1;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--ink2);font:700 13px/1.1 'Atkinson Hyperlegible','Noto Sans Tamil',sans-serif;position:relative;padding:6px 2px}
.nb svg{width:28px;height:28px}
.nb[aria-current=page]{color:var(--accent)}
.nb[aria-current=page]::before{content:'';position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--accent);border-radius:0 0 4px 4px}

/* controls */
.ic{width:1.3em;height:1.3em;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.2rem;padding:.55rem 1.15rem;border-radius:1rem;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;line-height:1.2;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.btn.block{width:100%}
.btn.lg{min-height:4rem;font-size:1.15rem}
.btn.sm{min-height:2.6rem;padding:.3rem .8rem;font-size:.9rem;border-radius:.8rem}
.link{background:none;border:0;padding:.3rem 0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.field{width:100%;min-height:3.2rem;padding:.55rem .9rem;border-radius:1rem;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink)}
.field::placeholder{color:var(--ink2);opacity:.8}
.lab{display:block;font-weight:700;margin:1rem 0 .35rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:1.2rem;padding:1rem 1.1rem}
.row{display:flex;align-items:center;gap:.8rem}
.grow1{flex:1;min-width:0}

/* intro */
.intro{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;background:var(--bg)}
.intro-in{width:min(100%,26rem)}
.wordmark{font-size:clamp(3.1rem,17vw,5rem);font-weight:800;letter-spacing:-.02em;line-height:1;margin:0 0 1.4rem;color:var(--ink)}

/* home */
.hello{padding:1.3rem 1.2rem 1.4rem;background:var(--surface2);border-radius:1.6rem;margin-top:.3rem}
.hello h1{font-size:clamp(2.4rem,10vw,3.8rem);letter-spacing:-.01em;margin:.05rem 0 .2rem;overflow-wrap:anywhere}
.hello-mic{display:flex;align-items:center;gap:1rem;margin-top:1.1rem}
.mic-big{flex:none;width:5.6rem;height:5.6rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;box-shadow:0 0 0 .45rem color-mix(in srgb,var(--accent) 24%,transparent)}
.mic-big svg{width:2.5rem;height:2.5rem}
.msgcard{margin-top:1rem;border:var(--bw) solid var(--accent);border-radius:1.2rem;padding:1rem 1.1rem;background:var(--surface)}
.msgcard .from{font-weight:800}
.goals{display:grid;gap:.6rem}
.goal{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;min-height:3.8rem;padding:.6rem .9rem;border-radius:1.1rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700}
.tick{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;border:2.5px solid var(--ink2);display:grid;place-items:center;color:var(--good-ink)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick svg{width:1.2rem;height:1.2rem}
.nextrem{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;border-radius:1.1rem;background:var(--surface2)}
.big-e{font-size:2.2rem;line-height:1}
.links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.4rem}

/* talk */
.chatlog{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem;min-height:35vh}
.b{max-width:90%;padding:.7rem 1rem;border-radius:1.2rem;white-space:pre-wrap;overflow-wrap:anywhere}
.b.s{background:var(--surface);border:var(--bw) solid var(--line);align-self:flex-start;border-bottom-left-radius:.3rem}
.b.u{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:.3rem}
.b .ls{display:inline-flex;align-items:center;gap:.4rem;margin:.4rem .6rem 0 0;padding:.2rem 0;background:none;border:0;color:var(--accent);font-weight:700;font-size:.9rem}
.b .btn{margin-top:.5rem}
.typing{display:flex;gap:.3rem;padding:.9rem 1rem}
.typing i{width:.55rem;height:.55rem;border-radius:50%;background:var(--ink2);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 .3rem}
.chip{min-height:2.7rem;padding:.3rem .9rem;border-radius:2rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.composer{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:.5rem;align-items:center;padding:.6rem 0;background:var(--bg)}
.micbtn{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.micbtn svg{width:1.7rem;height:1.7rem}
.listenbox{display:flex;align-items:center;gap:1rem;padding:.9rem 1rem;margin:.5rem 0;border-radius:1.2rem;background:var(--surface2);border:var(--bw) solid var(--accent)}
.pulse{flex:none;width:3.4rem;height:3.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pl 1.2s infinite}
.pulse svg{width:1.6rem;height:1.6rem}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 1.1rem transparent}}
.lt{color:var(--ink2);min-height:1.5em;overflow-wrap:anywhere}

/* mood */
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-top:1rem}
.mb{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:1rem .5rem;min-height:7.5rem;border-radius:1.3rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem}
.mb span{font-size:3rem;line-height:1}
.mb.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}

/* reminders */
.cats{display:flex;flex-wrap:wrap;gap:.5rem}
.catb{display:flex;flex-direction:column;align-items:center;min-width:4.6rem;padding:.5rem .4rem;border-radius:1rem;border:var(--bw) solid var(--line);background:var(--surface);font-size:.8rem;font-weight:700}
.catb span{font-size:1.7rem;line-height:1.2}
.catb[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.rem{display:flex;align-items:center;gap:.8rem;padding:.8rem .9rem;border-radius:1.1rem;background:var(--surface);border:var(--bw) solid var(--line);margin-bottom:.6rem}
.rem.done{background:var(--surface2)}
.rem .tt{font-weight:800}
.rem.done .tt{text-decoration:line-through;text-decoration-thickness:2px}

/* games */
.glist{display:grid;gap:.7rem;margin-top:1rem}
.grow{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:.9rem 1rem;min-height:5rem;border-radius:1.2rem;border:var(--bw) solid var(--line);background:var(--surface)}
.grow .gi{font-size:2.3rem;line-height:1;flex:none;width:3rem;text-align:center}
.grow small{display:block;color:var(--ink2);font-size:.85rem;line-height:1.35}
.grow b{font-size:1.1rem}
.badge{flex:none;padding:.15rem .6rem;border-radius:1rem;background:var(--surface2);font-weight:800;font-size:.85rem}
.phead{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.dots{display:flex;gap:.4rem;margin:.3rem 0 .8rem}
.dots i{flex:1;height:.55rem;border-radius:1rem;background:var(--line)}
.dots i.cur{background:var(--ink2)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}
.q{font:800 1.3rem/1.3 'Baloo Thambi 2','Noto Sans Tamil',sans-serif;margin:.4rem 0 .8rem}
.pic{font-size:min(30vw,8.5rem);line-height:1.15;text-align:center;padding:.8rem;background:var(--surface);border:var(--bw) solid var(--line);border-radius:1.6rem;margin-bottom:1rem}
.photo{display:block;width:min(72vw,14rem);aspect-ratio:1;object-fit:cover;border-radius:1.6rem;margin:0 auto 1rem;border:var(--bw) solid var(--line)}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;min-height:4rem;padding:.6rem 1rem;text-align:left;border-radius:1.1rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:800;font-size:1.15rem}
.opt small{display:block;font-weight:400;color:var(--ink2);font-size:.85rem}
.opt.ok{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.opt.ok small{color:inherit}
.opt.no{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.opt.no small{color:inherit}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.4rem 0}
.ynb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;min-height:7rem;border-radius:1.4rem;border:0;font:800 1.5rem/1 'Baloo Thambi 2','Noto Sans Tamil',sans-serif}
.ynb svg{width:2.6rem;height:2.6rem;stroke-width:3}
.ynb.good{background:var(--good);color:var(--good-ink)}
.ynb.bad{background:var(--bad);color:var(--bad-ink)}
.ynb:disabled{opacity:.35}
.fb{margin:1rem 0 .8rem;padding:.8rem 1rem;border-radius:1.1rem;font-weight:800;font-size:1.1rem}
.fb.ok{background:var(--good);color:var(--good-ink)}
.fb.no{background:var(--surface2);border:2px solid var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:.55rem;margin:.6rem 0}
.pc{min-width:0;aspect-ratio:1;border-radius:1rem;border:var(--bw) solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:min(9vw,2.7rem);font-weight:800;display:grid;place-items:center;padding:0}
.pc.up{background:var(--surface);color:var(--ink);border-color:var(--ink2)}
.pc.done{background:var(--surface2);border-color:var(--good);opacity:.85}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:.6rem 0}
.mt{min-width:0;aspect-ratio:1;display:grid;place-items:center;font-size:min(14vw,3.6rem);background:var(--surface);border:var(--bw) solid var(--line);border-radius:1.2rem}
.mt.q0{background:var(--surface2);border-style:dashed;font-weight:800;color:var(--ink2)}
.cd{display:flex;align-items:center;gap:.6rem;margin:.6rem 0 1rem;font-weight:800}
.cd b{font:800 2.2rem/1 'Baloo Thambi 2',sans-serif}
.opics{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.opic{min-width:0;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-height:7.5rem;padding:.6rem;border-radius:1.2rem;border:var(--bw) solid var(--line);background:var(--surface);font-size:3.2rem;line-height:1.15}
.opic small{font-size:.85rem;font-weight:700}
.opic.ok{background:var(--good);border-color:var(--good);color:var(--good-ink)}
.opic.no{background:var(--bad);border-color:var(--bad);color:var(--bad-ink)}
.result{text-align:center;padding:1.2rem .5rem}
.stars{font-size:3.4rem;line-height:1;color:var(--c2);letter-spacing:.2rem}
.result .btn{margin-top:.6rem}

/* progress + dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin:1rem 0}
.kpi{padding:.8rem .9rem;border-radius:1.1rem;background:var(--surface);border:var(--bw) solid var(--line)}
.kpi b{display:block;font:800 2rem/1.1 'Baloo Thambi 2',sans-serif}
.kpi span{color:var(--ink2);font-size:.85rem;line-height:1.3;display:block}
.dgrid{display:grid;gap:1rem}
@media(min-width:820px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .wide{grid-column:1/-1}}
.panel h3{margin-bottom:.5rem}
.cs{width:100%;height:auto;display:block}
.donut{max-width:8.5rem;margin:0 auto}
.tx{fill:var(--ink2);font-size:12px}
.tx2{fill:var(--ink);font-size:14px;font-weight:700}
.tv{fill:var(--ink);font-size:12px;font-weight:700}
.em{font-size:15px}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.bar{fill:var(--c1)}.bar.now{fill:var(--c2)}
.track{fill:var(--surface2)}
.track2{fill:none;stroke:var(--surface2);stroke-width:14}
.arc{fill:none;stroke:var(--good);stroke-width:14;stroke-linecap:round}
.dn{fill:var(--ink);font:800 22px 'Baloo Thambi 2',sans-serif}
.line{fill:none;stroke:var(--c1);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pt{fill:var(--surface);stroke:var(--c1);stroke-width:3}
.alert{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;margin:1rem 0;border-radius:1.1rem;border:3px solid var(--bad);background:var(--surface)}
.alert svg{color:var(--bad);width:2rem;height:2rem;flex:none}
.ev{display:flex;gap:.7rem;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border:0}
.ev time{flex:none;width:5.2rem;color:var(--ink2);font-size:.85rem;padding-top:.1rem}
ul.ins{margin:.2rem 0;padding-left:1.2rem}
ul.ins li{margin:.35rem 0}
details summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:.5rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5rem,1fr));gap:.6rem;margin:.6rem 0}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:1rem;display:block}
.ph small{display:block;text-align:center;font-weight:700;font-size:.8rem;line-height:1.2;margin-top:.2rem}
.ph .x{position:absolute;top:.2rem;right:.2rem;width:2rem;height:2rem;border-radius:50%;border:0;background:var(--bad);color:var(--bad-ink);display:grid;place-items:center}
.ph .x svg{width:1rem;height:1rem}
textarea.field{min-height:5rem;resize:vertical}

/* settings */
.sw{display:flex;align-items:center;gap:.6rem;min-height:3.4rem;padding:.4rem .7rem;border-radius:1rem;border:var(--bw) solid var(--line);background:var(--surface);font-weight:700;text-align:left}
.sw[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.6rem}
.dot3{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;border:1px solid rgba(128,128,128,.6)}
.sizer{display:flex;align-items:center;gap:.6rem}
.sizer .btn{min-width:3.6rem;font-size:1.2rem}
.lvl{display:flex;gap:.35rem;flex:1;justify-content:center}
.lvl i{width:.8rem;height:.8rem;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;padding:.8rem 0;background:none;border:0;border-bottom:1px dashed var(--line);text-align:left;font-weight:700}
.tog i{flex:none;width:3.2rem;height:1.8rem;border-radius:1rem;background:var(--line);position:relative;transition:background .2s}
.tog i::after{content:'';position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--surface);transition:left .2s}
.tog[aria-checked=true] i{background:var(--good)}
.tog[aria-checked=true] i::after{left:1.6rem}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(100%,34rem);max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:1.6rem 1.6rem 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));border:var(--bw) solid var(--line)}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:1.6rem}}
.sheet h2{margin-bottom:.4rem}
.okbig{width:4rem;height:4rem;border-radius:50%;background:var(--good);color:var(--good-ink);display:grid;place-items:center;margin-bottom:.6rem}
.okbig svg{width:2.2rem;height:2.2rem}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:none;max-width:calc(100% - 2rem);padding:.7rem 1.1rem;border-radius:1rem;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="intro" hidden></div>
<div id="app" hidden>
  <header class="top"><div class="wrap in" id="topin"></div></header>
  <main id="main" tabindex="-1"></main>
  <nav class="nav" aria-label="Main"><div class="in" id="navin"></div></nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   SperoCare — single file. State lives in localStorage on this device.

/* ---------- daily statistics ---------- */
const moodOf=d=>{const a=S.moods.filter(x=>x.d===d);return a.length?a[a.length-1]:null};
function remStats(d){
  const lg=S.remLog[d];let total,done;
  if(d===today()){total=S.reminders.length;done=lg?S.reminders.filter(r=>lg.done[r.id]).length:0}
  else{total=lg?lg.total:0;done=lg?Object.keys(lg.done).length:0}
  return {total:total,done:Math.min(done,total||done)};
}
function dayStats(d){
  const gs=S.games.filter(x=>x.d===d);
  const c=sum(gs,x=>x.c),n=sum(gs,x=>x.n);
  const acc=n?Math.min(1,c/n):null;
  const mood=moodOf(d),rs=remStats(d),chats=S.chatDays[d]||0;
  const mins=sum(gs,x=>x.ms)/60000;
  const any=gs.length>0||!!mood||rs.done>0||chats>0;
  let score=null;
  if(any){
    let earned=Math.min(gs.length,2)/2*30+(acc||0)*30+(mood?10:0)+(chats?5:0),poss=75;
    if(rs.total){earned+=rs.done/rs.total*25;poss+=25}
    score=Math.round(earned/poss*100);
  }
  return {games:gs,sessions:gs.length,acc:acc,mood:mood,remTotal:rs.total,remDone:rs.done,chats:chats,mins:mins,any:any,score:score};
}
function lastDays(n){const t0=today();return Array.from({length:n},(_,i)=>addDays(t0,i-(n-1)))}
function firstDate(){
  const ds=[].concat(S.games.map(x=>x.d),S.moods.map(x=>x.d),Object.keys(S.remLog),Object.keys(S.chatDays)).sort();
  return ds[0]||null;
}
function streak(){let d=today(),n=0;if(!dayStats(d).any)d=addDays(d,-1);while(n<400&&dayStats(d).any){n++;d=addDays(d,-1)}return n}
function nextReminder(){
  const d=today(),lg=S.remLog[d],now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  const open=S.reminders.filter(r=>!(lg&&lg.done[r.id])).sort((a,b)=>a.time<b.time?-1:1);
  return open.find(r=>r.time>=hm)||open[0]||null;
}
function setRemDone(id,on){
  const d=today();const lg=S.remLog[d]||(S.remLog[d]={done:{},total:0});
  lg.total=S.reminders.length;
  if(on)lg.done[id]=Date.now();else delete lg.done[id];
  touch();save();
}

let voices=[];

const spoken=s=>String(s).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim();
function speak(text,lang){
  if(!('speechSynthesis' in window)){toast(t('no_voice'));return}
  stopSpeak();
  const l=lang||(hasTamil(text)?'ta':S.lang);
  const u=new SpeechSynthesisUtterance(spoken(text));
  u.lang=l==='ta'?'ta-IN':'en-IN';
  const norm=v=>String(v.lang).toLowerCase().replace('_','-');
  const v=l==='ta'?voices.find(x=>norm(x).startsWith('ta')):(voices.find(x=>norm(x).startsWith('en-in'))||voices.find(x=>norm(x).startsWith('en')));
  if(v)u.voice=v;else if(l==='ta'&&voices.length)toast(t('no_ta_voice'),4000);
  u.rate=S.slow?0.8:0.95;
  try{speechSynthesis.speak(u)}catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}

/* ---------- voice in (mic) ---------- */
let sr=null,listening=false,srCancel=false;
function showListen(on,text){
  const b=$('#listenbox');const mb=$('#micbtn');
  if(mb)mb.setAttribute('aria-pressed',on?'true':'false');
  if(!b)return;
  b.hidden=!on;
  if(on){const lt=$('#lt');if(lt)lt.textContent=text||t('speak_now')}
}
function stopListen(cancel){
  srCancel=!!cancel;
  if(sr){try{cancel?sr.abort():sr.stop()}catch(e){}}
  if(cancel){listening=false;showListen(false)}
}
function startListen(){
  const C=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!C){toast(t('no_mic_support'),4500);return}
  if(listening){stopListen(false);return}
  stopSpeak();srCancel=false;
  let finalT='';
  try{
    sr=new C();sr.lang=ta()?'ta-IN':'en-IN';sr.interimResults=true;sr.continuous=false;sr.maxAlternatives=1;
    sr.onstart=()=>{listening=true;showListen(true,'')};
    sr.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalT+=r[0].transcript;else interim+=r[0].transcript}showListen(true,finalT||interim)};

let sampleFn=null,sampleOff=false;
async function getSample(){
  if(sampleOff)return null;if(sampleFn)return sampleFn;
  try{if(!window.claude||!window.claude.use){sampleOff=true;return null}
    const s=await window.claude.use('sample');if(!s){sampleOff=true;return null}sampleFn=s;return s}
  catch(e){sampleOff=true;return null}
}
async function askClaude(text){
  const s=await getSample();if(!s)return null;
  const st=dayStats(today()),nx=nextReminder();
  const hist=S.chat.slice(-9,-1).map(m=>(m.r==='u'?'Person: ':'Spero: ')+m.text).join('\n');
  const prompt=[
   'You are Spero, a warm and patient companion inside SperoCare, an app for older adults in Tamil Nadu, India.',
   'App language: '+(ta()?'Tamil (தமிழ்), written in Tamil script':'English')+'. Use it unless the person clearly writes in the other language (Tamil script or Tamil typed in English letters counts as Tamil); then match them. Tamil replies must be in Tamil script.',
   'Speak like a caring friend or a kind neighbour: simple everyday words, natural spoken style, 1 to 3 short sentences, at most one gentle question. No lists, no markdown, no emojis.',
   'Never diagnose or advise on medicines. If they mention pain, a fall, breathlessness or feeling very unwell, tell them to press the red Help button and contact family or a doctor (ambulance 108).',
   'If they seem sad or lonely, stay with them warmly without lecturing. Do not pretend to do things the app cannot do (phone calls, orders).',
   'Facts you may use if helpful: their name is '+S.name+'; local time '+new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})+'; today\'s mood check-in: '+(st.mood?st.mood.m:'not done yet')+'; next reminder: '+(nx?nx.text+' at '+nx.time:'none')+'.',
   hist?('Conversation so far:\n'+hist):'',
   'Person: '+text,
   'Spero:'
  ].filter(Boolean).join('\n\n');
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const to=setTimeout(()=>{try{ctrl&&ctrl.abort()}catch(e){}},25000);
  try{
    const r=await s(prompt,{modelTier:'quick',cache:false,signal:ctrl?ctrl.signal:undefined});
    const out=(r&&r.text||'').replace(/[*_#`]/g,'').trim();
    return out||null;
  }catch(e){if(e&&e.code==='not_granted')sampleOff=true;return null}
  finally{clearTimeout(to)}
}

function scrollBottom(){requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight))}
function addMsg(r,text,a){
  const m={r:r,text:text,t:Date.now()};if(a)m.a=a;
  S.chat.push(m);if(S.chat.length>40)S.chat.shift();save();
  const log=$('#chatlog');if(log){log.insertAdjacentHTML('beforeend',bubbleHTML(m));scrollBottom()}
  return m;
}
function addTyping(){const log=$('#chatlog');if(!log)return null;log.insertAdjacentHTML('beforeend','<div class="b s typing" id="typing"><i></i><i></i><i></i></div>');scrollBottom();return $('#typing')}
let chatBusy=false;
async function sendChat(text,o){
  o=o||{};text=String(text||'').trim();if(!text||chatBusy)return;
  chatBusy=true;
  addMsg('u',text);S.chatDays[today()]=(S.chatDays[today()]||0)+1;touch();save();
  const ty=addTyping();
  const loc=localIntent(text);
  let reply,a;
  try{
    if(loc&&loc.hard){reply=loc.text;a=loc.a}
    else{
      reply=await askClaude(text);
      if(!reply){const r=loc||{text:pick(FALLBACK[S.lang])};reply=r.text;a=r.a}
    }
  }finally{chatBusy=false}
  if(ty)ty.remove();
  addMsg('s',reply,a);
  if(o.voice&&S.voiceReply)speak(reply);
}

/* ---------- charts (inline SVG, theme-aware) ---------- */
function svgWrap(H,inner,label){return `<svg class="cs" viewBox="0 0 320 ${H}" role="img" aria-label="${esc(label||'')}">${inner}</svg>`}
function barsSVG(vals,labels,o){
  o=o||{};const W=320,H=o.h||170,pl=30,pr=6,pt=22,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=vals.length,max=o.max||100,bw=Math.min(30,iw/n*.6);
  let s='';
  (o.grid||[0,50,100]).forEach(v=>{const y=pt+ih-ih*v/max;s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="tx" x="${pl-5}" y="${y+4}" text-anchor="end">${v}</text>`});
  vals.forEach((v,i)=>{const cx=pl+iw*(i+.5)/n;
    if(v==null)s+=`<text class="tx" x="${cx}" y="${pt+ih-6}" text-anchor="middle">–</text>`;
    else{const h=Math.max(3,ih*Math.min(v,max)/max),y=pt+ih-h;s+=`<rect class="bar${i===n-1?' now':''}" x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="6"/><text class="tv" x="${cx}" y="${y-5}" text-anchor="middle">${Math.round(v)}</text>`}
    s+=`<text class="tx" x="${cx}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  return svgWrap(H,s,o.label);
}
function moodSVG(vals,emos,labels,label){
  const W=320,H=190,pl=32,pr=14,pt=28,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;
  const X=i=>pl+iw*(i+.5)/n,Y=v=>pt+ih-ih*(v-1)/4;
  let s='';
  [[5,'😊'],[3,'😐'],[1,'😔']].forEach(a=>{s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(a[0])}" y2="${Y(a[0])}"/><text class="em" x="${pl-6}" y="${Y(a[0])+5}" text-anchor="end">${a[1]}</text>`});
  let d='',pen=false;
  vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true});
  if(d)s+=`<path class="line" d="${d}"/>`;
  vals.forEach((v,i)=>{if(v!=null)s+=`<circle class="pt" cx="${X(i)}" cy="${Y(v)}" r="5"/><text class="em" x="${X(i)}" y="${Y(v)-11}" text-anchor="middle">${emos[i]}</text>`;
    s+=`<text class="tx" x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`});
  return svgWrap(H,s,label);
}
function hbarsSVG(rows,label){
  const W=320,rh=40,H=Math.max(50,rows.length*rh+4);let s='';
  rows.forEach((r,i)=>{const y=i*rh+2;
    s+=`<text class="tx2" x="0" y="${y+14}">${esc(r.label)}</text><text class="tv" x="${W}" y="${y+14}" text-anchor="end">${r.pct}%  <tspan class="tx">(${esc(r.sub)})</tspan></text><rect class="track" x="0" y="${y+21}" width="${W}" height="11" rx="5.5"/><rect class="bar" x="0" y="${y+21}" width="${Math.max(6,W*r.pct/100)}" height="11" rx="5.5"/>`});
  return svgWrap(H,s,label);
}
function donutSVG(done,total,label){
  const R=44,C=2*Math.PI*R,p=total?Math.min(1,done/total):0;
  return `<svg class="cs donut" viewBox="0 0 120 120" role="img" aria-label="${esc(label)}"><circle class="track2" cx="60" cy="60" r="${R}"/><circle class="arc" cx="60" cy="60" r="${R}" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text class="dn" x="60" y="67" text-anchor="middle">${done}/${total}</text></svg>`;
}

/* ---------- family dashboard ---------- */
function insights(){
  const out=[],d7=lastDays(7),fd=firstDate();
  if(!fd)return [t('ins_none')];
  out.push(t('ins_days',{n:d7.filter(d=>dayStats(d).any).length}));
  const acc=days=>{const gs=S.games.filter(g=>days.indexOf(g.d)>=0),n=sum(gs,x=>x.n);return n?Math.min(1,sum(gs,x=>x.c)/n):null};
  const a1=acc(d7),a0=acc(lastDays(14).slice(0,7));
  if(a1!=null&&a0!=null){const df=Math.round((a1-a0)*100);out.push(df>=5?t('ins_up',{n:df}):df<=-10?t('ins_down',{n:-df}):t('ins_flat'))}
  else if(a1!=null)out.push(t('ins_acc',{n:Math.round(a1*100)}));
  const md=S.moods.map(m=>m).slice(-3);
  if(md.length===3&&md.every(m=>MOODS[m.m].v<=2))out.push(t('ins_lowmood'));
  let tot=0,dn=0;d7.forEach(d=>{const r=remStats(d);tot+=r.total;dn+=r.done});
  if(tot)out.push(t('ins_rem',{n:Math.round(dn/tot*100)}));
  const cnt={};S.games.filter(g=>d7.indexOf(g.d)>=0).forEach(g=>{cnt[g.g]=(cnt[g.g]||0)+1});
  const fav=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(fav)out.push(t('ins_fav',{g:t('g_'+fav)}));
  return out;
}
function evTime(ts){const d=dkey(new Date(ts));return d===today()?fmtClock(ts):DAYS_S[new Date(ts).getDay()][ta()?1:0]+' '+fmtClock(ts)}
function events(){

  S.moods.slice(-15).forEach(m=>ev.push({t:m.t,x:t('ev_mood',{m:MOODS[m.m].e+' '+t('m_'+m.m)})}));
  lastDays(3).forEach(d=>{const lg=S.remLog[d];if(!lg)return;Object.keys(lg.done).forEach(id=>{const r=S.reminders.find(x=>x.id===id);ev.push({t:lg.done[id],x:t('ev_rem',{r:r?r.text:t('nav_remind')})})})});
  S.alerts.slice(-5).forEach(a=>ev.push({t:a.t,x:t('ev_sos')}));
  return ev.sort((a,b)=>b.t-a.t).slice(0,10);
}

   <p class="sm" style="margin-top:1rem">${t('device_note')}</p></div>`;

/* ======================= GAMES ======================= */
function gameHeader(title,sub){
  const dots=Array.from({length:G.total},(_,i)=>`<i class="${i<G.idx?(G.res&&G.res[i]?'ok':'no'):i===G.idx?'cur':''}"></i>`).join('');
  return `<div class="phead"><button class="btn sm" data-act="gexit" aria-label="${esc(t('back'))}">${ic('back')}</button><div class="grow1"><h1 style="font-size:1.3rem">${title}</h1>${sub?`<p class="sm">${sub}</p>`:''}</div></div><div class="dots">${dots}</div>`;
}
function recordGame(kind,correct,total,ms){
  S.games.push({g:kind,d:today(),c:correct,n:total,t:Date.now(),ms:ms||0});touch();save();
}
function finishScreen(kind,correct,total){
  const pct=total?Math.round(correct/total*100):0;
  const msg=pct>=80?t('res_great'):pct>=50?t('res_good'):t('res_try');
  const stars='★'.repeat(Math.max(1,Math.round(pct/33.34)))+'☆'.repeat(3-Math.max(1,Math.round(pct/33.34)));
  return `<div class="wrap"><div class="result"><div class="stars">${stars}</div><h1>${msg}</h1><p class="sm">${t('res_score',{c:correct,n:total})}</p>
    <button class="btn primary lg block" data-act="pick" data-g="${kind}">${t('play_again')}</button>
    <button class="btn block" data-act="go" data-to="games">${t('more_games')}</button>
    <button class="btn block" data-act="go" data-to="home">${t('nav_home')}</button></div></div>`;
}

/* ---- 1. Name the picture (multiple choice) ---- */
function startName(){
  const pool=pickN(ITEMS,8);
  G={kind:'name',total:pool.length,idx:0,correct:0,res:[],startedAt:Date.now(),
     qs:pool.map(it=>{
       const sameCat=ITEMS.filter(x=>x.id!==it.id&&x.c===it.c);
       const distractors=sameCat.length>=2?pickN(sameCat,2):pickN(ITEMS.filter(x=>x.id!==it.id),2);
       return {it:it,opts:shuffle([it].concat(distractors)).map(x=>x.id),locked:false};
     })};
  render();
}
function renderName(){
  const q=G.qs[G.idx],it=q.it;
  return `<div class="wrap">${gameHeader(t('g_name'))}
    <p class="q">${t('name_q')}</p>
    <div class="pic" aria-hidden="true">${it.e}</div>
    <div class="opts">${q.opts.map(id=>{const o=ITEMS.find(x=>x.id===id);
      const cls=q.locked?(id===it.id?'ok':(id===q.picked?'no':'')):'';
      return `<button class="opt ${cls}" data-act="nameopt" data-id="${id}" ${q.locked?'disabled':''}>${cap(nm(o))}${ta()?'<small>'+cap(nm2(o))+'</small>':''}</button>`}).join('')}</div>
    ${q.locked?`<div class="fb ${q.picked===it.id?'ok':'no'}">${q.picked===it.id?t('correct'):t('wrong_is',{a:cap(nm(it))})}</div><button class="btn primary lg block" data-act="next">${t('next')}</button>`:''}
  </div>`;
}
function nameOpt(id){
  const q=G.qs[G.idx];if(q.locked)return;q.locked=true;q.picked=id;
  const ok=id===q.it.id;if(ok)G.correct++;G.res[G.idx]=ok;
  speak(ok?t('correct'):t('wrong_is',{a:cap(nm(q.it))}));
  render();
}

/* ---- 2. Yes / No (tap-only) ---- */
function startYesno(){
  const n=8,qs=[];
  for(let i=0;i<n;i++){const it=pick(ITEMS);const wrong=Math.random()<0.5;const shown=wrong?pick(ITEMS.filter(x=>x.id!==it.id)):it;qs.push({it:it,shown:shown,ans:!wrong,locked:false})}
  G={kind:'yesno',total:n,idx:0,correct:0,res:[],startedAt:Date.now(),qs:qs};render();
}
function renderYesno(){
  const q=G.qs[G.idx];
  return `<div class="wrap">${gameHeader(t('g_yesno'))}
    <p class="q">${t('yn_q',{w:cap(nm(q.it))})}</p>
    <div class="pic" aria-hidden="true">${q.shown.e}</div>
    <div class="yn">
      <button class="ynb good" data-act="ynopt" data-v="1" ${q.locked?'disabled':''}>${ic('check')}${t('yes')}</button>
      <button class="ynb bad" data-act="ynopt" data-v="0" ${q.locked?'disabled':''}>${ic('x')}${t('no')}</button>
    </div>
    ${q.locked?`<div class="fb ${q.ok?'ok':'no'}">${q.ok?t('correct'):t('wrong_is',{a:cap(nm(q.shown))})}</div><button class="btn primary lg block" data-act="next">${t('next')}</button>`:''}
  </div>`;
}
function ynOpt(v){
  const q=G.qs[G.idx];if(q.locked)return;q.locked=true;
  const said=v===1;q.ok=said===q.ans;if(q.ok)G.correct++;G.res[G.idx]=q.ok;
  speak(q.ok?t('correct'):t('wrong_is',{a:cap(nm(q.shown))}));render();
}

/* ---- 3. Memory pairs ---- */
function startPairs(){
  const n=6,its=pickN(ITEMS,n);
  const cards=shuffle(its.concat(its).map((it,i)=>({key:it.id+'_'+(i<n?'a':'b'),it:it})));
  G={kind:'pairs',cards:cards,open:[],matched:{},moves:0,startedAt:Date.now(),locked:false};render();
}
function pairsGrid(){
  const cols=G.cards.length<=8?4:6;
  return `<div class="pgrid" style="--cols:${cols}">${G.cards.map((c,i)=>{
    const up=G.open.indexOf(i)>=0||G.matched[c.key];
    return `<button class="pc ${up?'up':''} ${G.matched[c.key]?'done':''}" data-act="pflip" data-i="${i}" ${up||G.locked?'disabled':''} aria-label="${up?esc(nm(c.it)):esc(t('card'))}">${up?c.it.e:'?'}</button>`}).join('')}</div>`;
}
function renderPairs(){
  const done=Object.keys(G.matched).length/2;
  return `<div class="wrap">${gameHeader(t('g_pairs'),t('pairs_progress',{d:done,n:G.cards.length/2}))}
    <p class="q">${t('pairs_q')}</p>${pairsGrid()}
    ${done===G.cards.length/2?`<div class="fb ok">${t('pairs_done',{n:G.moves})}</div><button class="btn primary lg block" data-act="pairsfinish">${t('continue')}</button>`:''}
  </div>`;
}
function pairsFlip(i){
  if(G.locked||G.open.indexOf(i)>=0||G.matched[G.cards[i].key])return;
  G.open.push(i);
  if(G.open.length===1){render();return}
  G.locked=true;G.moves++;render();
  const [a,b]=G.open,ca=G.cards[a],cb=G.cards[b];
  timers.push(setTimeout(()=>{
    if(ca.it.id===cb.it.id){G.matched[ca.key]=1;G.matched[cb.key]=1;speak(t('matched'))}
    G.open=[];G.locked=false;render();
  },ca.it.id===cb.it.id?550:900));
}
function pairsFinish(){recordGame('pairs',G.cards.length/2,G.cards.length/2,Date.now()-G.startedAt);render(finishScreenPairs())}
function finishScreenPairs(){return finishScreen('pairs',G.cards.length/2,G.cards.length/2)}

/* ---- 4. What's missing ---- */
function startMissing(){
  const n=6,rounds=5,qs=[];
  for(let r=0;r<rounds;r++){const its=pickN(ITEMS,n);const miss=Math.floor(Math.random()*n);
    qs.push({its:its,miss:miss,opts:shuffle([its[miss]].concat(pickN(ITEMS.filter(x=>its.indexOf(x)<0),2))).map(x=>x.id),phase:'show',locked:false})}
  G={kind:'missing',total:rounds,idx:0,correct:0,res:[],startedAt:Date.now(),qs:qs};render();
  timers.push(setTimeout(()=>{if(G&&G.kind==='missing'){G.qs[G.idx].phase='ask';render()}},4200));
}
function renderMissing(){
  const q=G.qs[G.idx];
  if(q.phase==='show')return `<div class="wrap">${gameHeader(t('g_missing'))}<p class="q">${t('missing_look')}</p>
    <div class="mgrid">${q.its.map(it=>`<div class="mt">${it.e}</div>`).join('')}</div><p class="sm" style="text-align:center">${t('missing_wait')}</p></div>`;
  return `<div class="wrap">${gameHeader(t('g_missing'))}<p class="q">${t('missing_q')}</p>
    <div class="mgrid">${q.its.map((it,i)=>i===q.miss?`<div class="mt q0">?</div>`:`<div class="mt">${it.e}</div>`).join('')}</div>
    <div class="opts">${q.opts.map(id=>{const o=ITEMS.find(x=>x.id===id),correctId=q.its[q.miss].id;
      const cls=q.locked?(id===correctId?'ok':(id===q.picked?'no':'')):'';
      return `<button class="opt ${cls}" data-act="missopt" data-id="${id}" ${q.locked?'disabled':''}>${cap(nm(o))}</button>`}).join('')}</div>
    ${q.locked?`<div class="fb ${q.picked===q.its[q.miss].id?'ok':'no'}">${q.picked===q.its[q.miss].id?t('correct'):t('wrong_is',{a:cap(nm(q.its[q.miss]))})}</div><button class="btn primary lg block" data-act="next">${t('next')}</button>`:''}
  </div>`;
}
function missOpt(id){
  const q=G.qs[G.idx];if(q.locked||q.phase!=='ask')return;q.locked=true;q.picked=id;
  const correctId=q.its[q.miss].id,ok=id===correctId;if(ok)G.correct++;G.res[G.idx]=ok;
  speak(ok?t('correct'):t('wrong_is',{a:cap(nm(q.its[q.miss]))}));render();
}

/* ---- 5. What day / date ---- */
function startDate(){
  const n=5,qs=[];
  for(let i=0;i<n;i++){const off=Math.floor(Math.random()*7)-3;const type=pick(['day','month']);
    const base=new Date(),d=new Date(base);d.setDate(d.getDate()+off);
    if(type==='day'){const correct=DAYS[d.getDay()][ta()?1:0];const others=shuffle(DAYS.map(x=>x[ta()?1:0]).filter(x=>x!==correct)).slice(0,2);
      qs.push({type:'day',off:off,prompt:off===0?t('date_today'):off===1?t('date_tmr'):off===-1?t('date_ystd'):t('date_offset',{n:Math.abs(off),dir:off>0?t('after'):t('before')}),correct:correct,opts:shuffle([correct].concat(others)),locked:false});
    }else{const correct=MONTHS[d.getMonth()][ta()?1:0];const others=shuffle(MONTHS.map(x=>x[ta()?1:0]).filter(x=>x!==correct)).slice(0,2);
      qs.push({type:'month',off:off,prompt:t('date_month',{n:d.getDate()}),correct:correct,opts:shuffle([correct].concat(others)),locked:false});}
  }
  G={kind:'date',total:n,idx:0,correct:0,res:[],startedAt:Date.now(),qs:qs};render();
}
function renderDate(){
  const q=G.qs[G.idx];
  return `<div class="wrap">${gameHeader(t('g_date'))}<p class="q">${q.prompt}</p>
    <div class="opts">${q.opts.map(o=>{const cls=q.locked?(o===q.correct?'ok':(o===q.picked?'no':'')):'';
      return `<button class="opt ${cls}" data-act="dateopt" data-v="${esc(o)}" ${q.locked?'disabled':''}>${esc(o)}</button>`}).join('')}</div>
    ${q.locked?`<div class="fb ${q.picked===q.correct?'ok':'no'}">${q.picked===q.correct?t('correct'):t('wrong_is',{a:q.correct})}</div><button class="btn primary lg block" data-act="next">${t('next')}</button>`:''}
  </div>`;
}
function dateOpt(v){
  const q=G.qs[G.idx];if(q.locked)return;q.locked=true;q.picked=v;
  const ok=v===q.correct;if(ok)G.correct++;G.res[G.idx]=ok;
  speak(ok?t('correct'):t('wrong_is',{a:q.correct}));render();
}

/* ---- 6. Family faces ---- */
function startPeople(){
  if(S.photos.length<2){G=null;openModal(`<h2>${t('people_none_t')}</h2><p>${t('people_none_d')}</p><button class="btn primary block" style="margin-top:1rem" data-act="closemodal" data-autofocus>${t('ok')}</button>`);render();return}
  const n=Math.min(5,S.photos.length),qs=[];
  const pool=pickN(S.photos,Math.min(n,S.photos.length));
  pool.forEach(p=>{const others=pickN(S.photos.filter(x=>x.id!==p.id).map(x=>x.rel),Math.min(2,S.photos.length-1));
    qs.push({p:p,opts:shuffle([p.rel].concat(others)),locked:false})});
  G={kind:'people',total:qs.length,idx:0,correct:0,res:[],startedAt:Date.now(),qs:qs};render();
}
function renderPeople(){
  const q=G.qs[G.idx];

    <img class="photo" src="${q.p.img}" alt="${esc(q.p.name)}">
    <div class="opts">${q.opts.map(rel=>{const cls=q.locked?(rel===q.p.rel?'ok':(rel===q.picked?'no':'')):'';
      return `<button class="opt ${cls}" data-act="peopleopt" data-v="${esc(rel)}" ${q.locked?'disabled':''}>${esc(rel)}</button>`}).join('')}</div>
    ${q.locked?`<div class="fb ${q.picked===q.p.rel?'ok':'no'}">${q.picked===q.p.rel?t('correct'):t('wrong_is',{a:q.p.rel})}</div><button class="btn primary lg block" data-act="next">${t('next')}</button>`:''}
  </div>`;
}
function peopleOpt(v){
  const q=G.qs[G.idx];if(q.locked)return;q.locked=true;q.picked=v;
  const ok=v===q.p.rel;if(ok)G.correct++;G.res[G.idx]=ok;
  speak(ok?t('correct'):t('wrong_is',{a:q.p.rel}));render();
}

const STARTERS={name:startName,yesno:startYesno,pairs:startPairs,missing:startMissing,date:startDate,people:startPeople};
const RENDERERS={name:renderName,yesno:renderYesno,pairs:renderPairs,missing:renderMissing,date:renderDate,people:renderPeople};
function nextQ(){
  if(!G)return;
  if(G.kind==='pairs')return;
  if(G.idx<G.total-1){G.idx++;render()}

function playGame(kind){G=null;R='game';history.replaceState(null,'',location.pathname);STARTERS[kind]();}

/* ======================= ROUTER / CHROME / HANDLERS ======================= */
const NAV=[['home','home'],['talk','chat'],['games','games'],['remind','bell'],['family','family']];
function renderChrome(){
  $('#topin').innerHTML=`<button class="brand" data-act="go" data-to="home">SperoCare</button>
    <button class="hb" data-act="opendisplay" aria-label="${esc(t('text_size'))}"><span class="aa">A<small>A</small></span></button>
    <button class="hb help" data-act="sos">${ic('sos')}${t('help')}</button>`;
  $('#navin').innerHTML=NAV.map(n=>`<button class="nb" data-act="go" data-to="${n[0]}" aria-current="${R===n[0]?'page':'false'}">${ic(n[1])}<span>${t('nav_'+n[0])}</span></button>`).join('');
}
function render(overrideHTML){
  applyTheme();
  if(R==='game'&&G){$('#main').innerHTML=RENDERERS[G.kind]();afterRender();return}
  if(overrideHTML!=null){$('#main').innerHTML=overrideHTML;afterRender();return}
  renderChrome();
  const v=VIEWS[R]||VIEWS.home;
  $('#main').innerHTML=v();
  afterRender();
}
function afterRender(){
  $$('.nb').forEach(b=>b.setAttribute('aria-current',(R===b.getAttribute('data-to'))?'page':'false'));
  if(R==='talk')scrollBottom();
  const ci=$('#chatin');
  if(ci){ci.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doSend()}}}
}
function go(view){
  stopSpeak();if(listening)stopListen(true);
  if(R==='game'&&G&&view!==null){G=null}
  R=view;save();
  $('#main').focus({preventScroll:true});
  window.scrollTo(0,0);
  render();
}

/* ---- top-level actions ---- */
function doSend(){const el=$('#chatin');if(!el)return;const v=el.value;el.value='';sendChat(v,{voice:false})}
function toggleMic(){startListen()}
function doMood(m){
  S.moods.push({m:m,d:today(),t:Date.now()});touch();save();moodJust=m;render();
}
function markMsgRead(id){const m=S.msgs.find(x=>x.id===id);if(m)m.read=true;save();render()}
function remAdd(){
  const tx=$('#r-text'),tm=$('#r-time');const text=(tx.value||'').trim();
  if(!text){toast(t('fill_reminder'));tx.focus();return}
  S.reminders.push({id:uid(),text:text,time:tm.value||'08:00',cat:remCat});touch();save();
  toast(t('reminder_added'));tx.value='';render();
}
function remQuick(cat,tm){S.reminders.push({id:uid(),text:t('cat_'+cat),time:tm,cat:cat});touch();save();toast(t('reminder_added'));render()}
function remToggle(id){const d=today(),lg=S.remLog[d]||(S.remLog[d]={done:{},total:S.reminders.length});setRemDone(id,!lg.done[id]);render()}
function remDel(id){S.reminders=S.reminders.filter(r=>r.id!==id);save();render()}
function famSend(){
  const f=$('#f-from'),tx=$('#f-text');const text=(tx.value||'').trim();
  if(!text){toast(t('fill_message'));return}
  S.famFrom=(f.value||'').trim()||t('family');S.msgs.push({id:uid(),from:S.famFrom,text:text,t:Date.now(),read:false});save();
  toast(t('msg_sent'));render();
}
function photoPreview(){
  const inp=$('#f-photo');if(!inp||!inp.files||!inp.files[0]){pendingPhoto=null;const p=$('#prev');if(p)p.innerHTML='';return}
  const file=inp.files[0],reader=new FileReader();
  reader.onload=()=>{pendingPhoto=reader.result;const p=$('#prev');if(p)p.innerHTML=`<img src="${pendingPhoto}" alt="" style="width:5.5rem;aspect-ratio:1;object-fit:cover;border-radius:1rem;margin:.4rem 0">`};
  reader.readAsDataURL(file);
}
function photoAdd(){
  const nEl=$('#p-name'),rEl=$('#p-rel');
  if(!pendingPhoto){toast(t('pick_photo_first'));return}
  const name=(nEl.value||'').trim(),rel=(rEl.value||'').trim();
  if(!name||!rel){toast(t('fill_photo_fields'));return}
  S.photos.push({id:uid(),img:pendingPhoto,name:name,rel:rel});save();pendingPhoto=null;toast(t('photo_added'));render();
}
function photoDel(id){S.photos=S.photos.filter(p=>p.id!==id);save();render()}
function alertSeen(id){const a=S.alerts.find(x=>x.id===id);if(a)a.seen=true;save();render()}
function doSOS(){
  S.alerts.push({id:uid(),t:Date.now(),seen:false});save();
  openModal(`<div class="okbig">${ic('sos')}</div><h2>${t('sos_title')}</h2><p>${t('sos_body')}</p>
    <button class="btn primary lg block" data-act="say" data-say="${esc(t('sos_body'))}" style="margin-top:.6rem">${ic('speaker')}${t('listen')}</button>
    <button class="btn block" style="margin-top:.6rem" data-act="closemodal" data-autofocus>${t('ok')}</button>`);
  speak(t('sos_body'));
}
function renameSave(){const el=$('#s-name');const v=(el.value||'').trim();if(v){S.name=v;save();toast(t('name_saved'));render()}}
function setLang(l){
  S.lang=l;save();
  if(!S.done){introName=($('#in-name')&&$('#in-name').value)||introName;$('#intro').innerHTML=viewIntro();return}
  if(displayOpen())openDisplay();render();
}
function setTheme(k){S.theme=k;save();if(displayOpen())openDisplay();render()}
function setTextSize(d){S.text=Math.max(0,Math.min(4,S.text+d));save();applyTheme();if(displayOpen())openDisplay();else render()}
function toggleVoiceReply(){S.voiceReply=!S.voiceReply;save();render()}
function toggleSlow(){S.slow=!S.slow;save();render()}
function loadDemo(){
  const rnd=mulberry(42),d0=today();S.games=[];S.moods=[];S.remLog={};S.chatDays={};S.reminders=[
    {id:uid(),text:t('cat_medicine'),time:'08:00',cat:'medicine'},{id:uid(),text:t('cat_water'),time:'11:00',cat:'water'},{id:uid(),text:t('cat_walk'),time:'17:30',cat:'walk'}];
  for(let i=13;i>=0;i--){const d=addDays(d0,-i);if(rnd()<0.12&&i>0)continue;
    const moodK=MOOD_ORDER[Math.min(5,Math.floor(rnd()*5+(i<4?1.2:0)))];S.moods.push({m:moodK,d:d,t:parseK(d).getTime()+9*3600000});
    const ng=1+Math.floor(rnd()*2);for(let g=0;g<ng;g++){const kind=GAME_ORDER[Math.floor(rnd()*GAME_ORDER.length)];const n=6+Math.floor(rnd()*3);const acc=0.55+rnd()*0.4;S.games.push({g:kind,d:d,c:Math.round(n*acc),n:n,t:parseK(d).getTime()+(10+g*3)*3600000,ms:60000+rnd()*90000})}
    const lg={done:{},total:S.reminders.length};S.reminders.forEach(r=>{if(rnd()<0.8)lg.done[r.id]=parseK(d).getTime()+8*3600000});S.remLog[d]=lg;
    S.chatDays[d]=Math.floor(rnd()*3);
  }
  S.msgs=[{id:uid(),from:t('family'),text:t('demo_msg1'),t:Date.now()-3600000,read:false}];
  S.photos=[];S.alerts=[{id:uid(),t:Date.now()-86400000*2,seen:true}];
  touch();save();toast(t('demo_loaded'));render();
}
function eraseAll(){openModal(`<h2>${t('erase_confirm_t')}</h2><p>${t('erase_confirm_d')}</p>
  <div class="row" style="margin-top:1rem"><button class="btn bad block" data-act="eraseconfirm">${t('erase')}</button><button class="btn block" data-act="closemodal" data-autofocus>${t('cancel')}</button></div>`)}
function eraseConfirm(){
  S=DEF();introName='';save();closeModal();stopSpeak();if(listening)stopListen(true);
  R='home';G=null;
  $('#app').hidden=true;$('#intro').hidden=false;$('#intro').innerHTML=viewIntro();
  applyTheme();
}

/* ---- global click / input delegation ---- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.getAttribute('data-act');
  if(act==='start'){
    const nm=($('#in-name')&&$('#in-name').value||'').trim();
    if(!nm){toast(t('need_name'));$('#in-name')&&$('#in-name').focus();return}
    S.name=nm;S.done=true;touch();save();boot();return;
  }
  if(act==='setlang'){setLang(b.getAttribute('data-l'));return}
  if(act==='go'){go(b.getAttribute('data-to'));return}
  if(act==='mic'){toggleMic();return}
  if(act==='send'){doSend();return}
  if(act==='chip'){sendChat(t(b.getAttribute('data-k')),{voice:false});return}
  if(act==='say'){speak(b.getAttribute('data-say'));return}
  if(act==='mood'){doMood(b.getAttribute('data-m'));return}
  if(act==='msgread'){markMsgRead(b.getAttribute('data-id'));return}
  if(act==='remdone'){setRemDone(b.getAttribute('data-id'),true);render();return}
  if(act==='remtoggle'){remToggle(b.getAttribute('data-id'));return}
  if(act==='remdel'){remDel(b.getAttribute('data-id'));return}
  if(act==='remadd'){remAdd();return}
  if(act==='remquick'){remQuick(b.getAttribute('data-k'),b.getAttribute('data-tm'));return}
  if(act==='cat'){remCat=b.getAttribute('data-k');render();return}
  if(act==='pick'){playGame(b.getAttribute('data-g'));return}
  if(act==='gexit'){G=null;go('games');return}
  if(act==='next'){nextQ();return}
  if(act==='nameopt'){nameOpt(b.getAttribute('data-id'));return}
  if(act==='ynopt'){ynOpt(+b.getAttribute('data-v'));return}
  if(act==='pflip'){pairsFlip(+b.getAttribute('data-i'));return}
  if(act==='pairsfinish'){pairsFinish();return}
  if(act==='missopt'){missOpt(b.getAttribute('data-id'));return}
  if(act==='dateopt'){dateOpt(b.getAttribute('data-v'));return}
  if(act==='peopleopt'){peopleOpt(b.getAttribute('data-v'));return}
  if(act==='fsend'){famSend();return}
  if(act==='padd'){photoAdd();return}
  if(act==='pdel'){photoDel(b.getAttribute('data-id'));return}
  if(act==='alertseen'){alertSeen(b.getAttribute('data-id'));return}
  if(act==='sos'){doSOS();return}
  if(act==='rename'){renameSave();return}
  if(act==='theme'){setTheme(b.getAttribute('data-k'));return}
  if(act==='tsize'){setTextSize(+b.getAttribute('data-d'));return}
  if(act==='tvoice'){toggleVoiceReply();return}
  if(act==='tslow'){toggleSlow();return}
  if(act==='opendisplay'){openDisplay();return}
  if(act==='closemodal'){closeModal();return}
  if(act==='demo'){loadDemo();return}
  if(act==='erase'){eraseAll();return}
  if(act==='eraseconfirm'){eraseConfirm();return}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='f-photo')photoPreview()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen())closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---- boot ---- */
function boot(){
  applyTheme();
  $('#intro').hidden=true;$('#intro').innerHTML='';$('#app').hidden=false;
  R=S.done?(R==='intro-reset'?'home':R):'home';
  if(!S.done)R='home';
  render();
}
(function init(){
  applyTheme();
  if(S.done){boot();}
  else{introName='';$('#intro').hidden=false;$('#intro').innerHTML=viewIntro();$('#app').hidden=true;}
  window.addEventListener('pagehide',()=>{stopSpeak();if(listening)stopListen(true)});
})();
</script>
